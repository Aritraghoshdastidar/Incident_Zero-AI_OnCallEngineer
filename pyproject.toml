[project]
name = "oncall-agent"
version = "0.1.0"
description = "Evidence-grounded, safe-by-construction AI on-call engineer for the OpenTelemetry Demo"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aritraghoshdastidar" }]
keywords = ["aiops", "incident-response", "on-call", "llm-agent", "observability", "opentelemetry", "sre", "agentic-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "openai>=1.40",
]

[project.urls]
Homepage = "https://aritraghoshdastidar.github.io/Incident_Zero-AI_OnCallEngineer/"
Repository = "https://github.com/Aritraghoshdastidar/Incident_Zero-AI_OnCallEngineer"
Issues = "https://github.com/Aritraghoshdastidar/Incident_Zero-AI_OnCallEngineer/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "tools*", "safety*", "schema*", "eval*", "ui*", "report*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
extend-exclude = ["otel-demo", "data"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E731", "E701", "E702", "E741"]
